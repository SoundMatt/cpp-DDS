name: Release evidence

# RELAY spec §20.5 supply-chain integrity: "A conformant implementation MUST
# produce, in CI, a software bill of materials and build provenance for each
# release." Triggered on every release tag push; attaches the evidence to the
# matching GitHub release (created separately by the release process — see
# CLAUDE.md) once it exists.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  supply-chain:
    name: SBOM + build provenance
    runs-on: ubuntu-22.04
    steps:
      - name: Check out cpp-DDS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: cpp-DDS

      - name: Check out cpp-FuSa
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: SoundMatt/cpp-FuSa
          ref: v0.18.0
          path: cpp-FuSa

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build cpfusa
        run: |
          cmake -B cpp-FuSa/build -S cpp-FuSa -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build cpp-FuSa/build --parallel

      - name: cpfusa init
        working-directory: cpp-DDS
        run: |
          ../cpp-FuSa/build/cpfusa init --name cpp-DDS --standard iso26262 \
            --asil ASIL-B --project-version "${GITHUB_REF_NAME#v}" --force

      - name: cpfusa release (SBOM + provenance + artifact manifest)
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa release

      - name: Wait for the GitHub release to exist
        working-directory: cpp-DDS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::No GitHub release found for ${GITHUB_REF_NAME} after 5 minutes; skipping evidence upload."

      - name: Attach evidence to the GitHub release
        working-directory: cpp-DDS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              sbom.json provenance.json artifact-manifest.json --clobber
          fi
