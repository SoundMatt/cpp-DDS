name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: clang-14
            std: 17
            cc: clang-14
            cxx: clang++-14
          - os: ubuntu-22.04
            compiler: gcc-12
            std: 17
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: gcc-12
            std: 20
            cc: gcc-12
            cxx: g++-12
          - os: macos-14
            compiler: clang
            std: 17
            cc: clang
            cxx: clang++
          - os: windows-2022
            compiler: msvc
            std: 17
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -j1

  sanitizers:
    name: ASan + UBSan (IEC 61508 SIL-2 dynamic analysis)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Configure (ASan + UBSan)
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -G Ninja

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_stack_use_after_return=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build-san --output-on-failure -j1

  # ── RTPS interop against CycloneDDS (optional, service-gated) ─────────────
  # Builds with -DCPPDDS_INTEROP_TESTS=ON, starts a CycloneDDS container over
  # host networking (real UDP/multicast SPDP/SEDP), and runs the interop
  # CTest suite. Deliberately not a `needs:` dependency of, or depended on
  # by, any other job — it's excluded from the default build-and-test matrix
  # entirely (see interop/README.md and ROADMAP.md's "Interop testing
  # infrastructure" section) and skips gracefully (green) rather than
  # failing when the CycloneDDS Docker image is unavailable in the runner's
  # registry, mirroring go-DDS's own test-interop CI job exactly.
  test-interop:
    name: RTPS interop (CycloneDDS, ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Probe Docker and CycloneDDS image
        id: probe
        run: |
          if docker pull eclipse-cyclonedds/cyclonedds:latest 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CycloneDDS Docker image not available — skipping interop tests"
          fi

      - name: Start CycloneDDS peer
        if: steps.probe.outputs.available == 'true'
        run: docker compose -f interop/docker-compose.yml up -d cyclone-peer

      - name: Configure (CPPDDS_INTEROP_TESTS=ON)
        if: steps.probe.outputs.available == 'true'
        run: |
          cmake -B build-interop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPDDS_INTEROP_TESTS=ON \
            -G Ninja

      - name: Build
        if: steps.probe.outputs.available == 'true'
        run: cmake --build build-interop --parallel

      - name: Run interop CTest suite
        if: steps.probe.outputs.available == 'true'
        env:
          INTEROP_TIMEOUT: "15s"
        run: ctest --test-dir build-interop -L interop --output-on-failure -j1

      - name: Stop CycloneDDS peer
        if: steps.probe.outputs.available == 'true'
        run: docker compose -f interop/docker-compose.yml down

  coverage:
    name: Coverage (LCOV)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build lcov

      - name: Configure (coverage build)
        run: |
          cmake -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -G Ninja

      - name: Build
        run: cmake --build build-cov --parallel

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure -j1

      - name: Generate LCOV report
        run: |
          lcov --capture --directory build-cov \
               --output-file coverage.info \
               --no-external
          lcov --remove coverage.info '*/tests/*' '*/cli/*' \
               --output-file coverage.info
          lcov --summary coverage.info

  relay-conform:
    name: RELAY conformance (relay conform)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build CLI
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -G Ninja
          cmake --build build --parallel --target cpp-dds

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install relay tool
        run: go install github.com/SoundMatt/RELAY/v2/cmd/relay@v2.0.4

      - name: RELAY conformance gate
        run: relay conform --strict ./build/cli/cpp-dds

      # §20.1 item 3 / §20.2: convert's output MUST equal the reference
      # relay.Message for every golden vector of this implementation's
      # protocol, checked against `relay convert`'s in-process reference
      # participant (no second binary required).
      - name: RELAY behavioural conformance gate (relay interop)
        run: relay interop --protocol DDS --strict ./build/cli/cpp-dds

  fusa-asil-b:
    name: cpp-FuSa ASIL-B qualification
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - name: Check out cpp-DDS
        uses: actions/checkout@v4
        with:
          path: cpp-DDS

      - name: Check out cpp-FuSa
        uses: actions/checkout@v4
        with:
          repository: SoundMatt/cpp-FuSa
          ref: v0.18.0
          path: cpp-FuSa

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build zip

      - name: Build cpfusa
        run: |
          cmake -B cpp-FuSa/build \
            -S cpp-FuSa \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build cpp-FuSa/build --parallel

      - name: cpfusa init
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa init --name cpp-DDS --standard iso26262 --asil ASIL-B --project-version 0.25.0 --force

      # cpfusa init's default .fusa.json only scans src/ and include/ (§1.2.1
      # sourceDirs), and always writes a fresh, empty .fusa-reqs.json — never
      # this repo's real requirements/requirements.json (123 requirements).
      # Left as-is, §20.1's traceability gate below would silently measure
      # zero requirements every run (see #43). Widen sourceDirs to the
      # project's actual source layout (cli/ and ddstool/ carry real
      # //fusa:req annotations too — see CLAUDE.md's file table — and
      # tests/ carries every //fusa:test annotation) and convert the real
      # registry into the schema cpfusa's trace command loads.
      - name: Load real requirements registry + widen source scan (§20.1)
        working-directory: cpp-DDS
        run: |
          python3 - <<'PY'
          import json

          with open(".fusa.json") as f:
              cfg = json.load(f)
          cfg["sourceDirs"] = ["src", "include", "cli", "ddstool", "tests"]
          with open(".fusa.json", "w") as f:
              json.dump(cfg, f, indent=2)

          with open("requirements/requirements.json") as f:
              reqs = json.load(f)
          out = [{
              "id": r["id"],
              "title": r["title"],
              "description": r["text"],
              "standard_ref": "; ".join(r.get("standards", [])),
              "severity": "cybersecurity" if r.get("category") == "security" else "safety",
          } for r in reqs]
          with open(".fusa-reqs.json", "w") as f:
              json.dump({"requirements": out}, f, indent=2)
          print(f"Loaded {len(out)} requirements into .fusa-reqs.json")
          PY

      - name: cpfusa check
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa check --dir .

      # No `|| true`: LINT015 previously flagged two false positives here
      # (cli/json_lite.hpp:128,140 — see fusa:suppress comments at those
      # lines and #44) which is why this step was masked; with those
      # dispositioned via cpfusa's own per-line suppression mechanism, an
      # ERROR-level finding anywhere else now genuinely fails the build.
      - name: cpfusa lint
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa lint --dir .

      # §20.1 item 2 requires traceability at 100% (every requirement traced
      # AND tested). This repo is currently at 100% annotated / 96%+ tested
      # against the real registry loaded above (see #43); --req-coverage /
      # --sec-tested gate on that for real instead of the previous no-op
      # (which always "passed" against an empty, freshly-initialised
      # registry regardless of actual coverage).
      - name: cpfusa trace (requirements traceability)
        working-directory: cpp-DDS
        # NOTE: real measured sec-tested coverage against the loaded registry is
        # 96.7% (119/123), not 100% — verified by running cpfusa trace locally.
        # Raising this to 100 without first adding the missing //fusa:test
        # annotations would make this step fail on every run. Left at 96
        # pending an actual test-coverage pass (see cpp-DDS-14 finding (c)).
        run: ../cpp-FuSa/build/cpfusa trace --dir . --req-coverage 100 --sec-tested 96

      # §20.1 item 2 requires the full x-FuSa lifecycle, not a subset: standard
      # check + traceability (above) plus cybersecurity analysis, dependency
      # vulnerability scan, and tool qualification — all gating.
      # NOTE: cpp-FuSa's `cyber` subcommand still only supports --strict and
      # --write as of v0.18.0 (re-verified against a local build of the
      # pinned tag) — there is no --check/diff flag. Left at --write; genuine
      # drift detection would require committing a baseline cyber-report.json
      # and diffing it in CI, or a cpp-FuSa feature addition, either of which
      # is out of scope here.
      - name: cpfusa cyber (cybersecurity analysis, ISO 21434)
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa cyber --write

      - name: cpfusa vuln (dependency vulnerability scan)
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa vuln

      - name: cpfusa qualify (tool qualification suite)
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa qualify

  dco:
    name: DCO check
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          MISSING=$(git log --format="%H %s" "$BASE".."$HEAD" | while read hash msg; do
            if ! git show "$hash" | grep -qiE "^    Signed-off-by:"; then
              echo "$hash $msg"
            fi
          done)
          if [ -n "$MISSING" ]; then
            echo "ERROR: The following commits are missing Signed-off-by:"
            echo "$MISSING"
            exit 1
          fi
          echo "All commits have Signed-off-by."

  sarif:
    name: SARIF upload
    runs-on: ubuntu-22.04
    needs: build-and-test
    permissions:
      security-events: write
    steps:
      - name: Check out cpp-DDS
        uses: actions/checkout@v4
        with:
          path: cpp-DDS

      - name: Check out cpp-FuSa
        uses: actions/checkout@v4
        with:
          repository: SoundMatt/cpp-FuSa
          ref: v0.18.0
          path: cpp-FuSa

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build cpfusa
        run: |
          cmake -B cpp-FuSa/build \
            -S cpp-FuSa \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build cpp-FuSa/build --parallel

      - name: cpfusa init
        working-directory: cpp-DDS
        run: ../cpp-FuSa/build/cpfusa init --name cpp-DDS --standard iso26262 --asil ASIL-B --project-version 0.25.0 --force

      - name: Generate SARIF report
        working-directory: cpp-DDS
        run: |
          ../cpp-FuSa/build/cpfusa check \
            --format sarif \
            --output cpfusa.sarif \
            --dir . || true

      - name: Upload SARIF to GitHub Security tab
        if: hashFiles('cpp-DDS/cpfusa.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cpp-DDS/cpfusa.sarif
